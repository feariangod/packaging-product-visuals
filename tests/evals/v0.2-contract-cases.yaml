direction_matrix_cases:
  - id: complete-passed-matrix
    expected_selection_eligible: true
    direction_ids: [direction-a, direction-b]
    sku_ids: [citrus, berry]
    requested_artifact_ids: [a-citrus, a-berry, b-citrus, b-berry]
    rows:
      - {direction_id: direction-a, sku_id: citrus, requested_artifact_id: a-citrus, artifact_id: artifact-a-citrus, status: passed, locator: generated/a-citrus.png, comparison_gates_passed: true}
      - {direction_id: direction-a, sku_id: berry, requested_artifact_id: a-berry, artifact_id: artifact-a-berry, status: passed, locator: generated/a-berry.png, comparison_gates_passed: true}
      - {direction_id: direction-b, sku_id: citrus, requested_artifact_id: b-citrus, artifact_id: artifact-b-citrus, status: passed, locator: generated/b-citrus.png, comparison_gates_passed: true}
      - {direction_id: direction-b, sku_id: berry, requested_artifact_id: b-berry, artifact_id: artifact-b-berry, status: passed, locator: generated/b-berry.png, comparison_gates_passed: true}

  - id: draft-cell-keeps-stage-incomplete
    expected_selection_eligible: false
    direction_ids: [direction-a]
    sku_ids: [citrus, berry]
    requested_artifact_ids: [a-citrus, a-berry]
    rows:
      - {direction_id: direction-a, sku_id: citrus, requested_artifact_id: a-citrus, artifact_id: artifact-a-citrus, status: passed, locator: generated/a-citrus.png, comparison_gates_passed: true}
      - {direction_id: direction-a, sku_id: berry, requested_artifact_id: a-berry, artifact_id: artifact-a-berry, status: draft, locator: generated/a-berry.png, comparison_gates_passed: false}

