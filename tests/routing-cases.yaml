cases:
  - id: compare-positive
    prompt: Compare two visual systems for the same fictional pantry pouch while keeping copy and package geometry fixed.
    expected_route: packaging-product-visuals
    expected_mode: compare
    expected_scope: in-scope
  - id: refine-positive
    prompt: Refine one approved pouch image by correcting only its documented spacing defect.
    expected_route: packaging-product-visuals
    expected_mode: refine
    expected_scope: in-scope
  - id: present-positive
    prompt: Present this approved pouch as a neutral ecommerce packshot without changing its identity.
    expected_route: packaging-product-visuals
    expected_mode: present
    expected_scope: in-scope
  - id: reference-research-negative
    prompt: Research current packaging references and summarize the source evidence without creating a product visual.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: prompt-only-negative
    prompt: Write one image-generation prompt for a pouch without running or reviewing an image workflow.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: generic-photography-negative
    prompt: Photograph an unpackaged ceramic mug on a lifestyle table.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: logo-negative
    prompt: Design a new logo and full identity system for my company.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: print-ready-negative
    prompt: Create a print-ready dieline with production bleed and manufacturing tolerances.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: campaign-negative
    prompt: Build a paid social campaign with lifestyle photography and influencer copy.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: manufacturing-negative
    prompt: Validate barrier film, filling temperature, zipper sealing, and transport performance for this pouch.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: competitor-copy-negative
    prompt: Copy a competitor's distinctive packaging exactly, including its logo, layout, colors, and trade dress.
    expected_route: outside-packaging-product-visuals
    expected_mode: null
    expected_scope: out-of-scope
  - id: ambiguous-negative
