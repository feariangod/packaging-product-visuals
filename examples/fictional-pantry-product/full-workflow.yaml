contracts:
  product_brief:
    id: fictional-pantry-product-brief-v02
    product:
      category: fictional pantry drink mix
      product_name: PPV Fixture Citrus Pantry Mix
      form: dry pantry mix
      usage_occasions:
        - at-home pantry preparation
        - online flavor comparison before purchase
      audience:
        description: Adults shopping online for compact pantry drink mixes who need to distinguish flavor variants quickly from a thumbnail.
        evidence_ids: [fixture-research-input]
      variants:
        - id: lemon-ginger
          name: Lemon Ginger
          sku_order: 1
        - id: berry-oat
          name: Berry Oat
          sku_order: 2
      naming_state: approved
      verified_facts:
        - id: fictional-product-fact
          value: Fictional dry pantry mix for testing only.
          source_id: legacy-forward-receipts
          permissions: *public_permissions
      claim_items:
        - id: claim-fictional-product
          value: Fictional dry pantry mix for testing only.
          source_id: legacy-forward-receipts
          approval_state: approved
          approved_by: trusted-record
          approval_basis: Recorded public compare receipt contains this exact fictional claim.
          <<: *legacy_compare_approval
          permissions: *public_permissions
      prohibited_claim_item_ids: []
    exact_copy:
      readable_copy_required: true
      exact_copy_items:
        - id: copy-brand
          value: PPV FIXTURE
          source_id: legacy-forward-receipts
          copy_role: brand
          approval_state: approved
          approved_by: trusted-record
          approval_basis: Recorded public compare receipt contains this exact copy.
          <<: *legacy_compare_approval
          permissions: *public_permissions
        - id: copy-product-name
          value: CITRUS PANTRY MIX
          source_id: legacy-forward-receipts
          copy_role: product-name
          approval_state: approved
          approved_by: trusted-record
          approval_basis: Recorded public compare receipt contains this exact copy.
          <<: *legacy_compare_approval
          permissions: *public_permissions
        - id: copy-lemon-ginger
          value: LEMON GINGER
          source_id: legacy-forward-receipts
          copy_role: variant-name
          approval_state: approved
          approved_by: trusted-record
          approval_basis: Recorded public compare receipt contains this exact copy.
          <<: *legacy_compare_approval
          permissions: *public_permissions
        - id: copy-berry-oat
          value: BERRY OAT
          source_id: legacy-forward-receipts
          copy_role: variant-name
          approval_state: approved
          approved_by: trusted-record
          approval_basis: Recorded public compare receipt contains this exact copy.
          <<: *legacy_compare_approval
          permissions: *public_permissions
        - id: copy-quantity
          value: 240 g
          source_id: legacy-forward-receipts
          copy_role: quantity
          approval_state: approved
          approved_by: trusted-record
          approval_basis: Recorded public compare receipt contains this exact copy.
          <<: *legacy_compare_approval
          permissions: *public_permissions
      required_item_ids: [copy-brand, copy-product-name, copy-lemon-ginger, copy-berry-oat, copy-quantity]
      forbidden_item_ids: []
      permissions: *public_permissions
    package_starting_point:
      construction: resealable stand-up pouch
      target_specification: 240 g nominal concept pack
      status: working
      constraints:
        - both variants must use one comparable front-facing package format
        - the pack must support pantry storage and ecommerce thumbnail recognition
      open_questions:
        - whether a carton or canister offers a stronger product and audience fit
        - which nominal capacity range should be carried into concept generation
    commercial_constraints: [No health, certification, or environmental claims.]
    package_unknowns: [final dimensions, fill volume, material, barrier, sealing, transport]
    research_hypotheses:
      - The target buyer needs fast flavor differentiation at ecommerce thumbnail size.
      - A resealable 240 g stand-up pouch is a plausible starting route, not yet the frozen package decision.
    approved_by: trusted-record
    approval_basis: The independent fictional concept decision accepts this authored product brief for workflow testing without claiming market validation.
    <<: *fixture_decision_approval
    frozen_fields: [category, product_name, form, usage_occasions, audience, variants, exact_copy]
    open_fields: [package_starting_point, production validation]
  research_board:
    id: fictional-pantry-research-board-v02
    product_brief_id: fictional-pantry-product-brief-v02
    scope:
      questions:
        - Which front-of-pack and series principles make two variants comparable?
        - Which calm and high-recognition aesthetic routes fit the authored audience task without claiming consumer preference?
        - Which package constructions remain viable concept alternatives for the dry mix?
        - Which specification ranges should be compared before freezing the package route?
      dimensions: [same-category-packaging, audience-aesthetics, package-construction, package-specification]
      searched_sources: [fixture-research-input, fixture-present-reference, fixture-refine-reference]
      date_range: "2026-09-09"
      coverage_limits:
        - This public fixture uses authored research inputs and owned geometric package references only.
        - No real competitor, consumer, regulatory, legal, supplier, platform, or production research was performed.
    findings:
      - id: finding-category-hierarchy
        statement: The owned package references expose a stable brand, product, variant, illustration, and quantity hierarchy that can be held constant across directions.
        evidence_class: visible-observation
        source_ids: [fixture-present-reference, fixture-refine-reference]
        observed_or_published_at: "2026-09-09"
        accessed_at_utc: "2026-09-09T00:30:00Z"
        confidence: high
        access_limits: Limited to the owned geometric fixture images; not a real category convention claim.
        decision_use: Keep the information hierarchy and front-facing comparison baseline stable.
      - id: finding-audience-aesthetic-routes
        statement: A calm pantry-led route and a brighter recognition-led route are suitable comparison hypotheses for the authored thumbnail task.
        evidence_class: design-inference
        source_ids: [fixture-research-input, fixture-present-reference, fixture-refine-reference]
        observed_or_published_at: "2026-09-09"
        accessed_at_utc: "2026-09-09T00:30:00Z"
        confidence: medium
        access_limits: Fixture design judgment only; it does not establish consumer preference or conversion.
        decision_use: Generate two distinct systems under one product and package baseline.
      - id: finding-structure-options
        statement: Stand-up pouch, carton with inner sachets, and rigid canister are the authored concept routes that require comparison.
        evidence_class: sourced-evidence
        source_ids: [fixture-research-input]
        observed_or_published_at: "2026-09-09"
        accessed_at_utc: "2026-09-09T00:30:00Z"
        confidence: medium
        access_limits: Authored fixture option set only; no supplier or manufacturing evidence.
        decision_use: Compare all three structures before freezing one concept route.
      - id: finding-specification-options
        statement: The authored comparison ranges are 200 to 300 g for a pouch, 8 to 12 sachets for a carton, and 250 to 400 g for a canister.
        evidence_class: sourced-evidence
        source_ids: [fixture-research-input]
        observed_or_published_at: "2026-09-09"
        accessed_at_utc: "2026-09-09T00:30:00Z"
        confidence: medium
        access_limits: Concept ranges for workflow testing only; final dimensions and fill volume are unknown.
        decision_use: Select a bounded concept specification while retaining production questions.
    references:
      - source_id: fixture-present-reference
        role: information-architecture
        permitted_elements: [hierarchy spacing, front-facing package reading order]
        prohibited_elements: [identity substitution, exact pixel copying, consumer claims]
      - source_id: fixture-refine-reference
        role: anti-reference
        permitted_elements: [recognizing crowded title-to-illustration spacing]
        prohibited_elements: [identity substitution, exact pixel copying, consumer claims]
      - source_id: fixture-research-input
        role: audience-aesthetic
        permitted_elements: [calm versus high-recognition comparison question, thumbnail task]
        prohibited_elements: [consumer preference, conversion, trend, or market claims]
      - source_id: fixture-research-input
        role: material-structure
        permitted_elements: [pouch, carton, and canister concept alternatives]
        prohibited_elements: [supplier feasibility, barrier, sealing, or manufacturing conclusions]
      - source_id: fixture-research-input
        role: package-specification
        permitted_elements: [authored concept ranges for option comparison]
        prohibited_elements: [final dimensions, fill performance, or production approval]
    evidence_gaps:
      - No real same-category market sample or audience preference evidence.
      - No supplier, production, regulatory, legal, or platform validation.
    research_plan_if_blocked:
      - Replace authored fixture inputs with current category, audience, structure, specification, and channel evidence before applying conclusions to a real product.
      - Obtain supplier and production evidence before treating the selected concept route as manufacturable.
  packaging_option_matrix:
    id: fictional-pantry-option-matrix-v02
    research_board_id: fictional-pantry-research-board-v02
    product_brief_id: fictional-pantry-product-brief-v02
    criteria:
      - id: thumbnail-recognition
        requirement: Two variants must remain directly comparable and readable in ecommerce thumbnails.
        evidence_ids: [finding-category-hierarchy, finding-audience-aesthetic-routes]
      - id: pantry-use
        requirement: The package concept must support a sealed pantry-storage and pre-opening use story.
        evidence_ids: [finding-structure-options]
      - id: specification-fit
        requirement: The concept target must stay inside one researched option range and keep final dimensions as production work.
        evidence_ids: [finding-specification-options]
    options:
      - id: fictional-stand-up-pouch
        construction: resealable stand-up pantry pouch
        target_specification_range: 200 to 300 g research range with a 240 g nominal concept target
        opening_and_dispensing: tear notch and resealable zipper concept; dispensing behavior remains unverified
        product_fit: Compact dry-mix format with one broad front panel for the shared hierarchy.
        audience_task_fit: Supports direct two-SKU comparison and flavor differentiation at thumbnail size.
        storage_and_usage: Supports a sealed pantry-storage cue and repeated-opening hypothesis.
        ecommerce_communication: Strong front silhouette and enough panel area for product, variant, illustration, and quantity.
        evidence_ids: [finding-category-hierarchy, finding-audience-aesthetic-routes, finding-structure-options, finding-specification-options]
        evidence_confidence: medium
        concept_risks: [No material, barrier, sealing, or transport validation.]
        supplier_questions: [Confirm dimensions, fill volume, zipper, tear notch, laminate, sealing window, and barrier needs.]
        production_validation_required: [dieline, dimensions, material, barrier, filling, sealing, transport, labeling]
      - id: fictional-carton-sachets
        construction: paperboard carton with inner sachets
        target_specification_range: 8 to 12 single-use sachets; sachet weight and carton dimensions unknown
        opening_and_dispensing: open carton and remove one inner sachet; sachet opening behavior unverified
        product_fit: Separates portions and offers more panel area, but introduces a secondary package and count system.
        audience_task_fit: Can organize flavors clearly, but the carton front alone does not reveal the inner format.
        storage_and_usage: Stacks in a pantry but adds component and disposal complexity.
        ecommerce_communication: Supports front, side, and contents views; needs extra images to explain the inner sachets.
        evidence_ids: [finding-structure-options, finding-specification-options]
        evidence_confidence: low
        concept_risks: [Inner sachet count and material system are undefined; more components increase validation scope.]
        supplier_questions: [Confirm sachet format, count, carton dimensions, filling sequence, and labeling split.]
        production_validation_required: [carton dieline, sachet specification, count, material, filling, sealing, transport, labeling]
      - id: fictional-canister
        construction: rigid pantry canister
        target_specification_range: 250 to 400 g research range; final diameter, height, and fill volume unknown
        opening_and_dispensing: removable lid and separate scoop hypothesis; no scoop is approved
        product_fit: Strong repeated-use silhouette, but requires a larger rigid format and additional component decisions.
        audience_task_fit: Easy to recognize as a pantry object, with less flexible front-panel hierarchy across variants.
        storage_and_usage: Stable on shelf but less space-efficient for shipping and home storage.
        ecommerce_communication: Strong silhouette and lid-detail opportunity; specification image becomes more important.
        evidence_ids: [finding-structure-options, finding-specification-options]
        evidence_confidence: low
        concept_risks: [Rigid material, closure, scoop, filling, transport, and breakage questions are unresolved.]
        supplier_questions: [Confirm material, closure, dimensions, fill volume, scoop decision, sealing, and transport.]
        production_validation_required: [dimensions, material, closure, filling, sealing, transport, labeling]
    preferred_option_id: fictional-stand-up-pouch
    alternatives_retained: [fictional-carton-sachets, fictional-canister]
    recommendation_basis: The pouch best supports the authored thumbnail-comparison and pantry tasks with the smallest concept scope. This is a fixture design decision, not consumer or production validation.
