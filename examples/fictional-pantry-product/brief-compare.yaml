    - typography treatment
product_baseline:
  id: fictional-pantry-baseline-v1
  product_facts:
    - id: product-name
      value: PPV Fixture Citrus Pantry Mix
      source_id: fictional-brief
  package_snapshot:
    form: stand-up pantry pouch
    geometry: front-facing gusset pouch with resealable top
  exact_copy_snapshot:
    required: [PPV FIXTURE, CITRUS PANTRY MIX, LEMON GINGER, BERRY OAT, 240 g]
  sku_order: [lemon-ginger, berry-oat]
  object_count: 2
  camera_baseline:
    view: front
    crop: full pouch with margin
  channel_snapshot:
    deliverable: ecommerce comparison board
  exclusions: [claims, certifications, real brands]
comparison_directions:
  - id: quiet-pantry
    name: Quiet Pantry
    objective: Make the fictional pantry format feel calm and ingredient-led.
    visual_definition:
      palette: warm paper with restrained yellow and red accents
      illustration: small geometric citrus and berry forms
      typography: compact serif display with plain sans labels
    target_values: {thumbnail_recognition: clear, decoration: restrained}
    reference_roles:
      - source_or_asset_id: corner-marker-reference
        role: geometry-only calibration
        permitted_elements: [corner markers]
        prohibited_elements: [branding, copy, claims]
    changed_fields: [visual_system, illustration_language]
    frozen_fields: [package, exact_copy, sku_order, camera]
    exclusions: [photographic food, real logos]
  - id: bright-counter
    name: Bright Counter
    objective: Increase shelf-block recognition while keeping the same pouch facts.
    visual_definition:
      palette: white field with high-contrast variant blocks
      illustration: large flat pantry ingredient shapes
      typography: rounded heavy sans with wide tracking
    target_values: {thumbnail_recognition: strong, decoration: moderate}
    reference_roles:
      - source_or_asset_id: corner-marker-reference
        role: geometry-only calibration
        permitted_elements: [corner markers]
        prohibited_elements: [branding, copy, claims]
    changed_fields: [visual_system, color_block_scale]
    frozen_fields: [package, exact_copy, sku_order, camera]
    exclusions: [photographic food, real logos]
channel:
  deliverable: ecommerce comparison board
  aspect_ratio: "4:3"
  review_profiles:
