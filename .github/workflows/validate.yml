name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run pytest
        run: python -m pytest -v
      - name: Run skills-ref validator when available
        shell: bash
        run: |
          if command -v skills-ref >/dev/null 2>&1; then
            skills-ref validate skills/packaging-product-visuals
          else
            echo "skills-ref validate is not installed on this runner; local supplemental validator skipped."
          fi
      - name: Run Codex quick_validate.py when available
        shell: bash
        run: |
          if [ -n "${CODEX_QUICK_VALIDATE:-}" ] && [ -f "$CODEX_QUICK_VALIDATE" ]; then
            python "$CODEX_QUICK_VALIDATE" skills/packaging-product-visuals
          elif command -v quick_validate.py >/dev/null 2>&1; then
            quick_validate.py skills/packaging-product-visuals
          else
            echo "quick_validate.py is not installed on this runner; local supplemental validator skipped."
          fi
      - name: Run Codex plugin validator when available
        shell: bash
        run: |
          if [ -n "${CODEX_PLUGIN_VALIDATE:-}" ] && [ -f "$CODEX_PLUGIN_VALIDATE" ]; then
            python "$CODEX_PLUGIN_VALIDATE" .
          else
            echo "Codex plugin validator is not installed on this runner; local supplemental validator skipped."
          fi
